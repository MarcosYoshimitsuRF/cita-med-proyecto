
# 1. Configuración del Servidor
server.port=8080

# 2. Nombre de la Aplicación
spring.application.name=cita-med-api

# 3. Configuración de la Base de Datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/cita_med_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ¡IMPORTANTE! Coloque sus credenciales de MySQL aquí
spring.datasource.username=root
spring.datasource.password=root

# 4. Configuración de JPA (Java Persistence API)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 5. Configuración de Seguridad
# Secreto para firmar y validar nuestros tokens JWT.
# Esta es una clave SHA-256 de 64 caracteres.
app.jwt.secret=fd8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b9b8b